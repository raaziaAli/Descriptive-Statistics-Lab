const valid=(q,v)=>{
 if(typeof v!=='string'||!v.trim())return false;
 if(q.options)return /^[0-9]+$/.test(v)&&Number(v)===q.a;
 if(q.a===undefined)return true;
 const value=s=>{s=s.trim().replace(/−/g,'-');return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN};
 if(q.array){const parts=v.split(',');return parts.length===q.a.length&&parts.every((s,i)=>Math.abs(value(s)-q.a[i])<=q.tol)}
 return Math.abs(value(v)-q.a)<=q.tol;
};
function restore(raw){
 if(!raw||raw.version!==1||!raw.answers||typeof raw.answers!=='object')throw Error('Invalid backup');
 const next=blank();
 for(const k of ['name','section'])if(typeof raw[k]==='string')next[k]=raw[k].slice(0,80);
 for(const q of questions)if(typeof raw.answers[q.id]==='string')next.answers[q.id]=raw.answers[q.id].slice(0,4000);
 for(const [i,p] of pages.entries()){
  if(!canOpen(next,i))continue;
  const qs=p.groups.flatMap(g=>g[3]);
  if(isQuiz(i)){
   const prior=raw[quizzes(i)];
   if(prior&&qs.every(q=>next.answers[q.id]?.trim()))next[quizzes(i)]={score:qs.filter(q=>valid(q,next.answers[q.id])).length,at:typeof prior.at==='string'?prior.at.slice(0,40):''};
  }else if(raw.done?.[i]&&qs.every(q=>valid(q,next.answers[q.id])))next.done[i]=true;
 }
 if(raw.days&&typeof raw.days==='object')for(const [d,ids] of Object.entries(raw.days).slice(-100))if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&Array.isArray(ids))next.days[d]=[...new Set(ids.filter(id=>byId.has(id)))];
 if(Array.isArray(raw.interruptions))next.interruptions=raw.interruptions.filter(x=>x&&typeof x.at==='string'&&typeof x.task==='string'&&typeof x.reason==='string').slice(-200).map(x=>({at:x.at.slice(0,40),task:x.task.slice(0,30),reason:x.reason.slice(0,80)}));
 return next;
}

 if(i===8||i===9)return !!st.done[7];
 return !!st.done[i-1];
}

function plot(sets,limits){
 if(!sets.length)return '';
 let min=limits?.[0]??Math.min(...sets.flat()),max=limits?.[1]??Math.max(...sets.flat());
 if(min===max){min--;max++}
 const x=v=>32+536*(v-min)/(max-min);
 return sets.map((a,i)=>{
 const counts={};let dots='';
 for(const v of a){counts[v]=(counts[v]??0)+1;dots+='<circle cx="'+x(v)+'" cy="'+(125-9*counts[v])+'" r="4.2" fill="'+['#1d725c','#a35420','#395c9f'][i%3]+'"/>'}
 return '<figure style="margin:10px 0"><svg viewBox="0 0 600 153" role="img" aria-label="Data '+list(a)+'"><path d="M32 128H568" stroke="#65796e"/>'+dots+'<text x="32" y="147" font-size="13">'+fmt(min)+'</text><text x="568" y="147" text-anchor="end" font-size="13">'+fmt(max)+'</text></svg><figcaption>Data '+(i+1)+' · '+list(a)+'</figcaption></figure>';
 }).join('');
}

 return '<article><label><span class="tag">'+q.id+'</span><br>'+esc(q.p)+control+'</label>'+(isLesson(page)?'<button data-check="'+q.id+'">Check response</button><p class="muted" id="f'+q.id+'" aria-live="polite"></p><details><summary>Hint</summary>'+esc(q.h??'Use the data above.')+'</details>':'')+'</article>';
}

 view.hidden=gated;
 view.inert=gated;
 if(gated)focus.innerHTML='<aside><h2>'+ (returning?'Return to your work':'Start full-screen work')+'</h2><p>Lessons, Homework, and Quiz require full screen. Switching away or leaving full screen pauses access to your work and adds a focus interruption to your report.</p><button class="primary" id="focus-start">'+(returning?'Return to '+pages[page].title:'Start '+pages[page].title)+'</button><p id="focus-error" role="status"></p></aside>';
}
function interrupt(reason){
 if(!active||page>=progressPage)return;
 active=false;
 view.querySelector('.lesson-video')?.pause();
 returning=true;
 clearInterval(timer);
 state.interruptions.push({at:new Date().toISOString(),task:pages[page].title,reason});
 state.interruptions=state.interruptions.slice(-200);
 save('Work saved. Return to full screen to continue.');
 focusUI();
 if(!document.hidden)focus.querySelector('button')?.focus();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)interrupt('Assignment tab hidden')});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)interrupt('Full screen exited')});
const lessonVideos=Object.freeze({
 'Lesson 4':'Lesson_4.mp4','Lesson 5':'Lesson_5.mp4','Lesson 6':'Lesson_6.mp4',
 'Lesson 7':'Lesson_7.mp4','Lesson 8':'Lesson_8.mp4','Lesson 9':'Lesson_9.mp4'
});
function lessonVideo(title){
 const file=lessonVideos[title];
 if(!file)return '';
 return '<aside><h3>Watch the narrated lesson</h3><p>Use the video controls to play, pause, or replay the explanation.</p>'+
 '<video class="lesson-video" controls playsinline disablepictureinpicture preload="none" src="./'+file+'" aria-label="'+esc(title)+' narrated video"></video>'+
 '<p id="video-status" role="status" hidden>Video could not play here. <a href="./'+file+'" download>Download '+esc(title)+' video</a>.</p></aside>';
}
function draw(){
 focusUI();
 clearInterval(timer);
 nav.innerHTML=[...pages.map(p=>p.title),'Progress'].map((t,i)=>'<button data-page="'+i+'" class="'+(i===page?'active':'')+'" '+(i===page?'aria-current="page"':'')+' '+(!open(i)?'disabled title="Complete the previous lesson first"':'')+'>'+esc(t)+(!open(i)?' 🔒':'')+'</button>').join('');
 nav.children[0].insertAdjacentHTML('beforebegin','<strong>Section 1</strong>');
 nav.children[6].insertAdjacentHTML('beforebegin','<strong>Section 2</strong>');
 if(page===progressPage){reportView();return}
 const p=pages[page],g=p.groups[group],locked=isQuiz(page)?!!state[quizzes(page)]:!!state.done[page];
 const completed=items(p).filter(q=>isQuiz(page)?state.answers[q.id]?.trim():valid(q,state.answers[q.id])).length;
 view.innerHTML='<article><div class="tag">'+esc(p.time??'AFTER LESSON 6')+'</div><h2>'+p.sub+'</h2><p>'+p.intro+'</p><progress value="'+completed+'" max="'+items(p).length+'"></progress><div class="muted" id="count">'+completed+' / '+items(p).length+' responses ready</div></article>'+
 (group===0?lessonVideo(p.title):'')+
 '<div class="row" aria-label="Tasks">'+p.groups.map((x,i)=>'<button data-group="'+i+'" class="'+(i===group?'active':'')+'">'+esc(x[0])+'</button>').join('')+'</div>'+
 '<aside><h3>'+esc(g[0])+'</h3><p>'+esc(g[1])+'</p>'+(isLesson(page)?'<button id="think">Start 45-second thinking time</button> <span id="clock"></span>':'')+plot(g[2])+
 (page===2&&group===2?'<label>People who answered all four questions <input id="slider" type="range" min="0" max="10" value="0"></label><div id="experiment"></div>':'')+
 (page===2&&group===0?'<label>One-variable calculator · enter comma-separated values<input id="dataset" placeholder="4, 6, 8"></label><button id="compute">Calculate x̄ and Sx</button><p id="computed" role="status"></p>':'')+
 '</aside>'+g[3].map(q=>field(q,locked)).join('')+
 '<div class="row">'+(group<p.groups.length-1?'<button class="primary" data-group="'+(group+1)+'">Next task</button>':'')+
 (locked?(isQuiz(page)?'<strong>Quiz submitted · '+state[quizzes(page)].score+' / '+items(p).length+'</strong>':'<strong>Completed</strong>'):'<button class="primary" id="complete">'+(isQuiz(page)?'Submit quiz':isHomework(page)?'Submit homework':'Complete '+p.title)+'</button>')+
 '<button id="save">Save work</button></div><p id="result" role="status" class="notice"></p>';
 const video=view.querySelector('.lesson-video');
 if(video)video.addEventListener('error',()=>{view.querySelector('#video-status').hidden=false});
 if(page===2&&group===2)experiment();
}
function experiment(){
 const k=Number(document.querySelector('#slider').value), a=[...Array(10-k).fill(0),...Array(k).fill(4)];
 document.querySelector('#experiment').innerHTML='<p>'+k+' at 4 · '+(10-k)+' at 0 · Mean '+fmt(mean(a))+' · Sample SD '+fmt(sd(a))+'</p>'+plot([a],[0,4]);
}
function report(part){
 const lines=['SPREAD LAB · DAILY PROGRESS',state.name+' | '+state.section,'Report date: '+date(),''];
 for(const [i,p] of pages.entries()){
  if(part&&Math.floor(i/5)+1!==part)continue;
  const qs=items(p), n=qs.filter(q=>state.answers[q.id]?.trim()).length;
  lines.push(p.title+': '+n+'/'+qs.length+' responses entered'+(state.done[i]?' · complete':''));
 }
 for(const i of [4,9])if(!part||Math.floor(i/5)+1===part){const score=state[quizzes(i)];lines.push(pages[i].title+': '+(score?score.score+'/6 · '+score.at:'awaiting submission'))}
 for(const [d,ids] of Object.entries(state.days).sort())lines.push(d+' · '+ids.length+' response(s) worked on · '+ids.join(', '));
 lines.push('', 'FOCUS INTERRUPTIONS · '+state.interruptions.length);
 for(const event of state.interruptions)lines.push(event.at+' · '+event.task+' · '+event.reason);
 lines.push('','RESPONSES');
 for(const q of (part?pages.slice((part-1)*5,part*5).flatMap(items):questions))if(state.answers[q.id]?.trim()){const v=state.answers[q.id];lines.push(q.id+' '+q.p+'\n'+(q.options?q.options[Number(v)]??v:v))}
 return lines.join('\n');
}
function reportView(){
 view.innerHTML='<article><h2>Progress report</h2><p>Finish all three lessons, homework, and quiz for the section you want to turn in. Enter your name or class ID and select that section. Then choose <strong>Download PDF report</strong>. Open the Spread Lab assignment in Google Classroom, attach the downloaded report, and select <strong>Turn in</strong>.</p><label>Name or class ID<input data-meta="name" maxlength="80" value="'+esc(state.name)+'"></label><label>Class period<input data-meta="section" maxlength="80" value="'+esc(state.section)+'"></label><label>Report section<select id="report-part"><option value="1">Section 1 · Lessons 4–6</option><option value="2">Section 2 · Lessons 7–9</option></select></label><div class="row"><button class="primary" id="download">Download PDF report</button></div><label>Report preview<textarea id="preview" readonly rows="9">'+esc(report(1))+'</textarea></label></article><aside><h3>Move to another device</h3><p>Download a backup before changing browsers or devices. Restoring a backup replaces the work in this browser.</p><button id="backup">Download backup</button><label>Restore a Spread Lab backup<input id="restore" type="file" accept=".json,application/json"></label></aside>';
}
function reportPdf(text){
 const symbols={'−':'-','–':'-','—':'-','·':'|','×':'x','÷':'/','²':'^2','√':'sqrt','≥':'>=','≤':'<=','’':"'",'“':'"','”':'"'};
 const clean=text.replace(/[^\x20-\x7e\n]/gu,c=>symbols[c]??(c.codePointAt(0)<=255?c:c.normalize('NFKD').replace(/[^\x20-\x7e]/g,'')||'?'));
 const lines=clean.split('\n').flatMap(line=>line.match(/.{1,88}(?:\s|$)|.{1,88}/g)??['']);
 const objects=['<< /Type /Catalog /Pages 2 0 R >>','', '<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>'];
 const kids=[];
 for(let i=0;i<lines.length;i+=50){
  const id=objects.length+1;
  kids.push(id+' 0 R');
  const stream='BT /F1 10 Tf 14 TL 42 750 Td\n'+lines.slice(i,i+50).map(line=>'('+line.replace(/[\\()]/g,'\\$&')+') Tj T*').join('\n')+'\nET';
  objects.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R >> >> /Contents '+(id+1)+' 0 R >>','<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream');
 }
 objects[1]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+kids.length+' >>';
 let pdf='%PDF-1.4\n';
 const offsets=objects.map((obj,i)=>{const start=pdf.length;pdf+=(i+1)+' 0 obj\n'+obj+'\nendobj\n';return start});
 return Uint8Array.from(pdf+'xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n'+offsets.map(x=>String(x).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objects.length+1)+' /Root 1 0 R >>\nstartxref\n'+pdf.length+'\n%%EOF\n',c=>c.charCodeAt(0));
}
function download(name,data,type){
 const url=URL.createObjectURL(new Blob([data],{type}));
 const link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function update(e){
 const {id,meta}=e.target.dataset;
 if(active&&id&&byId.has(id)&&!(isQuiz(page)&&state[quizzes(page)])){
  const q=byId.get(id),v=e.target.value;
  if(state.answers[id]===v)return;
  state.answers[id]=v;
  if(v.trim()){state.days[date()]??=[];if(!state.days[date()].includes(id))state.days[date()].push(id)}
  if(!isQuiz(page)&&!valid(q,v))delete state.done[page];
  if(!isQuiz(page)){for(const button of nav.querySelectorAll('[data-page]')){const i=Number(button.dataset.page);button.disabled=!open(i);button.textContent=(pages[i]?.title??'Progress')+(!open(i)?' 🔒':'')}}
  const n=items(pages[page]).filter(x=>isQuiz(page)?state.answers[x.id]?.trim():valid(x,state.answers[x.id])).length;
  view.querySelector('progress').value=n;document.querySelector('#count').textContent=n+' / '+items(pages[page]).length+' responses ready';
  const feedback=document.getElementById('f'+id);if(feedback)feedback.textContent='';
  save();
 }
 if(meta){state[meta]=e.target.value;save();document.querySelector('#preview').value=report(Number(document.querySelector('#report-part').value))}
 if(e.target.id==='slider')experiment();
}
view.addEventListener('input',update);
view.addEventListener('change',async e=>{
 if(e.target.id==='report-part'){document.querySelector('#preview').value=report(Number(e.target.value));return}
 if(e.target.tagName==='SELECT')update(e);
 if(e.target.id!=='restore'||!e.target.files[0])return;
 try{if(e.target.files[0].size>2000000)throw Error();const next=restore(JSON.parse(await e.target.files[0].text()));if(confirm('Replace the work in this browser with this backup?')){state=next;save('Backup restored.');draw()}}
 catch{status.textContent='That backup could not be read. Choose a Spread Lab JSON backup.'}
});
document.querySelector('main').addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.page!==undefined){const i=Number(b.dataset.page);if(open(i)){if(i===progressPage){active=false;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}page=i;group=0;draw()}return}
 if(b.id==='focus-start'){
  try{
   if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
   if(document.hidden||page>=progressPage||!document.fullscreenElement)return;
   active=true;returning=false;draw();view.querySelector('h2')?.scrollIntoView({block:'nearest'});
  }catch{const error=document.querySelector('#focus-error');if(error)error.textContent='Full screen is unavailable here. Open Spread Lab directly in a browser window that supports full screen.'}
  return;
 }
 if(page<progressPage&&!active)return;
 if(b.dataset.group!==undefined){group=Number(b.dataset.group);draw();view.scrollIntoView({block:'start'});return}
 if(b.dataset.check){const q=byId.get(b.dataset.check),v=state.answers[q.id];document.getElementById('f'+q.id).textContent=valid(q,v)?q.a===undefined?'Explanation recorded. Check that you included evidence.':'Correct.':v?.trim()?'Try again. Open the hint if you need a starting point.':'Enter a response first.';return}
 switch(b.id){
 case 'think':{clearInterval(timer);let end=Date.now()+45000;const clock=document.querySelector('#clock');clock.textContent='45 seconds';timer=setInterval(()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));clock.textContent=left?left+' seconds':'Ready? Record your prediction.';if(!left)clearInterval(timer)},250);break}
 case 'compute':{const raw=document.querySelector('#dataset').value.split(',').map(x=>x.trim().replace(/−/g,'-'));const a=raw.map(Number);document.querySelector('#computed').textContent=a.length<2||a.length>500||raw.some((x,i)=>!x||!Number.isFinite(a[i])||Math.abs(a[i])>1e12)?'Enter 2–500 finite numbers separated by commas.':'x̄ = '+fmt(mean(a),6)+' · Sx = '+fmt(sd(a),6);break}
 case 'save':save();break;
 case 'complete':{
  if(!open(page))return;
  const p=pages[page],qs=items(p),missing=qs.find(q=>isQuiz(page)?!state.answers[q.id]?.trim():!valid(q,state.answers[q.id]));
  if(missing){group=p.groups.findIndex(g=>g[3].includes(missing));draw();const target=view.querySelector('[data-id="'+missing.id+'"]');target.focus();status.textContent='Review '+missing.id+' before completing this section.';return}
  if(isQuiz(page))state[quizzes(page)]={score:qs.filter(q=>valid(q,state.answers[q.id])).length,at:new Date().toISOString()};
  else state.done[page]=true;
  save(isQuiz(page)?'Quiz score recorded.':p.title+' complete.');
  draw();break}
 case 'download':
  const part=Number(document.querySelector('#report-part').value);
  const start=part===1?0:5;
  if(![0,1,2,3].every(offset=>state.done[start+offset])||!state[quizzes(start+4)]){status.textContent='Finish the selected section, including its homework and quiz, before downloading its report.';break}
  if(!state.name.trim()){status.textContent='Enter your name or class ID first.';view.querySelector('[data-meta="name"]').focus();break}
  download('spread-lab-section-'+part+'.pdf',reportPdf(report(part)),'application/pdf');break;
 case 'backup':download('spread-lab-backup.json',JSON.stringify(state,null,2),'application/json');break;
 }
});
page=pages.findIndex((p,i)=>open(i)&&!(isQuiz(i)?state[quizzes(i)]:state.done[i]));
if(page<0)page=progressPage;
draw();
</script></html>
